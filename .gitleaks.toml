title = "blamejs.shop gitleaks config"

# Inherit gitleaks' default ruleset (AWS keys, GCP creds, GitHub tokens,
# npm tokens, generic high-entropy strings, etc.) and add project-
# specific allowlists below.
[extend]
useDefault = true

# gitleaks 8.21+ requires the [[allowlists]] (plural) form; the
# singular [allowlist] is deprecated. Each [[allowlists]] block is
# independent — a finding is suppressed if ANY block matches.

[[allowlists]]
description = "Vendored blamejs tree — pre-built bundles ship high-entropy literals (PQC test vectors, X.509 cert fixtures, etc.). Upstream blamejs already runs gitleaks against itself; re-scanning the vendored copy is double work + lots of false positives."
paths = [
  '''^lib/vendor/blamejs/''',
]

[[allowlists]]
description = "Release-signing PUBLIC key. The public key is committed under keys/release-pqc-pub.json so operators verify .mldsa.sig sidecars; the matching PRIVATE key lives only in the npm-publish environment secret RELEASE_PQC_SIGNING_KEY and is never in the repo. Allowlist the pub.json shape so its base64url payload isn't flagged."
paths = [
  '''^keys/release-pqc-pub\.json$''',
]

[[allowlists]]
description = "Release-notes JSONs may quote token shapes for documentation purposes (e.g. an explanation of how an operator verifies a release). Allowlist the path; prose discipline (no real secrets in CHANGELOG) is enforced separately by the generator's leak-vocabulary sweep + reviewer checklist."
paths = [
  '''^release-notes/.*\.json$''',
  '''^CHANGELOG\.md$''',
]

[[allowlists]]
description = "Test sources + smoke logs carry synthetic credential shapes inline (fake api_key / token / secret literals) to exercise input-validation and storage paths. These are fixtures whether they live in a fixtures/ subdir or directly in a *.test.js file, so the whole test tree is allowlisted. The detectors that GUARD the fixture catalog live in scripts/ and tests/, not in gitleaks."
paths = [
  '''^test/''',
  '''^\.test-output/''',
]

[[allowlists]]
description = "D1 migration files are pure schema DDL (CREATE TABLE / INDEX). The project stores credentials hash-only and never seeds plaintext secrets in a migration, so a match here is a column name like idempotency_key / signing_secret_hash, not a credential."
paths = [
  '''^migrations-d1/.*\.sql$''',
]

[[allowlists]]
description = "Generated asset manifest — sha384 Subresource Integrity digests for the shipped theme stylesheets + island scripts. These are PUBLIC integrity hashes (the browser checks the served bytes against them), not credentials; their high-entropy base64 trips the generic-api-key rule. The manifest is rebuilt + drift-gated by scripts/generate-asset-manifest.js."
paths = [
  '''^lib/asset-manifest\.json$''',
  '''^worker/asset-manifest\.json$''',
]
