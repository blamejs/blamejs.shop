<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Vault Stick — hardware authenticator with PQC keypair">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f44"/>
      <stop offset="100%" stop-color="#1a3a7a"/>
    </linearGradient>
    <linearGradient id="hwBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fa4f09"/>
      <stop offset="100%" stop-color="#c93b00"/>
    </linearGradient>
    <linearGradient id="usb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2c8a3f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2c8a3f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Vault Stick silhouette, rotated -->
  <g transform="translate(400,470) rotate(-18)">
    <!-- USB-A connector -->
    <rect x="-260" y="-30" width="120" height="60" rx="4" fill="url(#usb)" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>
    <rect x="-250" y="-18" width="100" height="36" rx="2" fill="#444"/>
    <!-- body -->
    <rect x="-140" y="-45" width="320" height="90" rx="14" fill="url(#hwBody)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <!-- touch ring -->
    <circle cx="120" cy="0" r="22" fill="rgba(0,0,0,0.45)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="120" cy="0" r="10" fill="url(#led)"/>
    <circle cx="120" cy="0" r="5" fill="#2c8a3f"/>
    <!-- branding -->
    <text x="-60" y="8" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="22" font-weight="800" letter-spacing="0.18em" fill="#ffffff">VAULT</text>
    <!-- keychain hole -->
    <circle cx="160" cy="-30" r="6" fill="rgba(0,0,0,0.5)"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#7fb1ff">CATALOG · HARDWARE</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Vault Stick</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.65)">ML-DSA-65 keypair · USB-A · touch attest</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.45)">VLT-STK-V1</text>
  </g>
</svg>
