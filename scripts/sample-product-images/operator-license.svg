    <text x="-240" y="-50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.7)">Holder</text>
    <text x="-240" y="-12" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff">operator@blamejs.shop</text>
    <text x="-240" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.2em" fill="rgba(255,255,255,0.5)">VALID THROUGH 2027-05-22</text>
    <g transform="translate(-240,80)">
      <rect x="0" y="0" width="280" height="40" rx="6" fill="rgba(0,0,0,0.35)"/>
      <text x="14" y="28" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="14" fill="rgba(255,255,255,0.78)">ml-dsa-65: oK9d3v…q42</text>
    </g>
    <g transform="translate(160,80)">
