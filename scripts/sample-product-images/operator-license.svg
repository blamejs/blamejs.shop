      <text x="0" y="27" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">PQC</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#b67aff">CATALOG · DIGITAL</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Operator License</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.7)">ML-DSA-signed delivery · 1-year term</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.45)">OPR-LIC-1Y</text>
