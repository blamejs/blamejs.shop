<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Audit Log Kit" color="#C254E8">
  <defs>
    <radialGradient id="alkGlow" cx="50%" cy="52%" r="56%">
      <stop offset="0%" stop-color="#AD38DB" stop-opacity="0.34"/>
      <stop offset="58%" stop-color="#732A8D" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#AD38DB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alkBookA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C254E8"/><stop offset="48%" stop-color="#AD38DB"/><stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
    <linearGradient id="alkBookB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AD38DB"/><stop offset="50%" stop-color="#8E33B0"/><stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
    <linearGradient id="alkBookC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E33B0"/><stop offset="55%" stop-color="#732A8D"/><stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
    <linearGradient id="alkSeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C254E8"/><stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#alkGlow)"/>
  <g stroke="currentColor" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 50 H300 M0 100 H300 M0 150 H300 M0 200 H300 M0 250 H300 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300"/>
  </g>
  <!-- bottom book III -->
  <g stroke="#5C2272" stroke-width="2.5" stroke-linejoin="round">
    <rect x="56" y="206" width="184" height="40" rx="7" fill="url(#alkBookC)"/>
    <rect x="56" y="206" width="15" height="40" rx="5" fill="#5C2272" stroke-opacity="0.6"/>
    <path d="M71 215 H230 M71 237 H230" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="63.5" y="231" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" stroke="none">III</text>
  </g>
  <!-- middle book II, fanned right -->
  <g stroke="#5C2272" stroke-width="2.5" stroke-linejoin="round">
    <rect x="64" y="160" width="184" height="40" rx="7" fill="url(#alkBookB)" transform="rotate(-2.5 156 180)"/>
    <rect x="64" y="160" width="15" height="40" rx="5" fill="#5C2272" stroke-opacity="0.6" transform="rotate(-2.5 156 180)"/>
    <path d="M79 169 H238 M79 191 H238" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" transform="rotate(-2.5 156 180)"/>
    <text x="71.5" y="185" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" stroke="none" transform="rotate(-2.5 156 180)">II</text>
  </g>
  <!-- top book I, fanned left -->
  <g stroke="#5C2272" stroke-width="2.5" stroke-linejoin="round">
    <rect x="52" y="112" width="184" height="42" rx="8" fill="url(#alkBookA)" transform="rotate(3 144 133)"/>
    <rect x="52" y="112" width="15" height="42" rx="5" fill="#5C2272" stroke-opacity="0.6" transform="rotate(3 144 133)"/>
    <text x="59.5" y="138" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" stroke="none" transform="rotate(3 144 133)">I</text>
  </g>
  <!-- wax-style holographic seal on top cover -->
  <g transform="rotate(3 144 133)">
    <circle cx="178" cy="133" r="22" fill="url(#alkSeal)" stroke="#5C2272" stroke-width="2.5"/>
    <circle cx="178" cy="133" r="16" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="178" cy="133" r="11" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <path d="M178 124 l8 4 v6 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-6 z" fill="#ffffff" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M174 133 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- white sheen -->
  <path d="M62 116 q40 -10 80 -2 l-6 9 q-38 -7 -76 1 z" fill="#ffffff" fill-opacity="0.12"/>
  <!-- glow accent dots -->
  <circle cx="150" cy="62" r="3.5" fill="#AD38DB"/>
  <circle cx="216" cy="232" r="3" fill="#C254E8" fill-opacity="0.85"/>
</svg>
