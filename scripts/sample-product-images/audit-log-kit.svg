<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Audit Log Kit — three numbered notebooks with serial-stamp seals">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a1f"/>
      <stop offset="100%" stop-color="#2c8a3f"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1e8"/>
      <stop offset="100%" stop-color="#dcd6c0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Three stacked notebooks -->
  <g transform="translate(400,470)">
    <!-- Notebook 3 (back) -->
    <g transform="translate(60,-110) rotate(-8)">
      <rect x="-150" y="-100" width="300" height="200" rx="6" fill="url(#book)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <rect x="-150" y="-100" width="14" height="200" fill="#fa4f09"/>
      <text x="0" y="-30" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="0.28em" fill="rgba(255,255,255,0.55)" text-anchor="middle">VOLUME III</text>
      <text x="0" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">AUDIT LOG</text>
      <text x="0" y="56" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">SN · 0003 / 0500</text>
    </g>
    <!-- Notebook 2 (middle) -->
    <g transform="translate(-40,-30) rotate(4)">
      <rect x="-150" y="-100" width="300" height="200" rx="6" fill="url(#book)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
      <rect x="-150" y="-100" width="14" height="200" fill="#fa4f09"/>
      <text x="0" y="-30" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="0.28em" fill="rgba(255,255,255,0.6)" text-anchor="middle">VOLUME II</text>
      <text x="0" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">AUDIT LOG</text>
      <text x="0" y="56" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">SN · 0002 / 0500</text>
    </g>
    <!-- Notebook 1 (front, open peek) -->
    <g transform="translate(40,80) rotate(-3)">
      <rect x="-150" y="-100" width="300" height="200" rx="6" fill="url(#book)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <rect x="-150" y="-100" width="14" height="200" fill="#fa4f09"/>
      <text x="0" y="-30" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="0.28em" fill="rgba(255,255,255,0.7)" text-anchor="middle">VOLUME I</text>
      <text x="0" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">AUDIT LOG</text>
      <!-- Wax-style seal -->
      <circle cx="100" cy="60" r="22" fill="#c93b00" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>
      <text x="100" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.1em" fill="#ffffff" text-anchor="middle">SEAL</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#7fe89b">CATALOG · BUNDLE</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Audit Log Kit</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.75)">Three numbered notebooks · wax seal · stamped</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.55)">AUD-LOG-KIT3</text>
  </g>
</svg>
