<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Build Pass — annual CI license for blamejs build infrastructure">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0f5c"/>
      <stop offset="100%" stop-color="#6a1bff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Build pass — ticket style with perforation -->
  <g transform="translate(400,450) rotate(3)">
    <!-- ticket body -->
    <path d="M-280 -120 L260 -120 L260 -40 A8 8 0 0 0 260 -24 L260 60 A8 8 0 0 0 260 76 L260 120 L-280 120 L-280 76 A8 8 0 0 0 -280 60 L-280 -24 A8 8 0 0 0 -280 -40 Z"
          fill="url(#card)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- perforation -->
    <line x1="140" y1="-110" x2="140" y2="110" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4 6"/>
    <!-- accent stripe -->
    <rect x="-280" y="-120" width="60" height="240" fill="#fa4f09"/>
    <text x="-250" y="0" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="22" font-weight="800" letter-spacing="0.4em" fill="#ffffff" transform="rotate(-90 -250 0)" text-anchor="middle">BUILD PASS</text>

    <!-- main pass content -->
    <text x="-200" y="-70" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="0.22em" fill="rgba(255,255,255,0.5)">ADMIT ONE · 12 MONTHS</text>
    <text x="-200" y="-20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Annual CI</text>
    <text x="-200" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.65)">Unlimited build minutes</text>
    <text x="-200" y="78" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="14" fill="rgba(255,255,255,0.5)">2026-05-22 → 2027-05-22</text>

    <!-- right stub with PQC seal -->
    <text x="200" y="-70" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.22em" fill="rgba(255,255,255,0.5)" text-anchor="middle">STUB</text>
    <circle cx="200" cy="0" r="38" fill="none" stroke="#fa4f09" stroke-width="3"/>
    <text x="200" y="8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800" fill="#fa4f09" text-anchor="middle">PASS</text>
    <text x="200" y="78" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">ML-DSA · CI</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#b67aff">CATALOG · DIGITAL</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Build Pass</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.7)">Annual CI license · signed receipt</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.45)">BLD-PSS-1Y</text>
  </g>
</svg>
