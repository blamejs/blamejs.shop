<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Starter Bundle — Operator Tee + Edge Reader v1 + Operator License">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c93b00"/>
      <stop offset="100%" stop-color="#ffae5e"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.65)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Three stacked boxes representing tee + reader + license -->
  <g transform="translate(400,500)">
    <!-- License (top) -->
    <g transform="translate(-40,-180) rotate(6)">
      <rect x="-110" y="-30" width="220" height="60" rx="8" fill="url(#box)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <text x="0" y="6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.12em" fill="#ffffff" text-anchor="middle">OPERATOR LICENSE</text>
    </g>
    <!-- Edge Reader (middle) -->
    <g transform="translate(20,-90) rotate(-3)">
      <rect x="-140" y="-40" width="280" height="80" rx="10" fill="url(#box)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <text x="0" y="8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.1em" fill="#ffffff" text-anchor="middle">EDGE READER v1</text>
    </g>
    <!-- Tee (bottom) -->
    <g transform="translate(-20,30) rotate(4)">
      <rect x="-160" y="-60" width="320" height="120" rx="12" fill="url(#box)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <text x="0" y="12" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="0.08em" fill="#ffffff" text-anchor="middle">OPERATOR TEE</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#ffffff">CATALOG · BUNDLE</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Starter Bundle</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.78)">Tee + Reader + License · single SKU</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.55)">STR-BND-A</text>
  </g>
</svg>
