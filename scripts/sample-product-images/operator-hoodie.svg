<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Operator Hoodie — heavyweight fleece pullover with chest wordmark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#191919"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.78" r="0.7">
      <stop offset="0%" stop-color="#fa4f09" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fa4f09" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>
  <rect width="800" height="800" fill="url(#glow)"/>

  <!-- Hoodie silhouette -->
  <g transform="translate(400,460)">
    <!-- body -->
    <path d="M-180 -140 L-110 -200 L-60 -180 L-30 -200 L30 -200 L60 -180 L110 -200 L180 -140 L210 -50 L150 -30 L150 180 L-150 180 L-150 -30 L-210 -50 Z"
          fill="#fa4f09" opacity="0.92"/>
    <!-- hood -->
    <path d="M-60 -180 L-30 -210 L0 -220 L30 -210 L60 -180 L40 -150 L0 -160 L-40 -150 Z"
          fill="#0d0d0d" opacity="0.55"/>
    <!-- pocket -->
    <path d="M-90 30 L90 30 L110 110 L-110 110 Z"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.22"/>
    <!-- drawstrings -->
    <line x1="-20" y1="-150" x2="-30" y2="-60" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5"/>
    <line x1="20" y1="-150" x2="30" y2="-60" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5"/>
    <!-- outline -->
    <path d="M-180 -140 L-110 -200 L-60 -180 L-30 -200 L30 -200 L60 -180 L110 -200 L180 -140 L210 -50 L150 -30 L150 180 L-150 180 L-150 -30 L-210 -50 Z"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.18" stroke-linejoin="round"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#fa4f09">CATALOG · APPAREL</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Operator Hoodie</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.65)">Heavyweight fleece · chest wordmark</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.45)">OPR-HOD-BLK-L</text>
  </g>
</svg>
