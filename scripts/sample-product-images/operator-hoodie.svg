<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Operator hoodie" color="#C254E8">
  <defs>
    <radialGradient id="hoodGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#AD38DB" stop-opacity="0.34"/>
      <stop offset="58%" stop-color="#732A8D" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#AD38DB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoodBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C254E8"/>
      <stop offset="48%" stop-color="#AD38DB"/>
      <stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
    <linearGradient id="hoodHood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E33B0"/>
      <stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
    <linearGradient id="hoodPocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#732A8D"/>
      <stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
  </defs>

  <rect width="300" height="300" fill="url(#hoodGlow)"/>

  <g stroke="currentColor" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 50 H300 M0 100 H300 M0 150 H300 M0 200 H300 M0 250 H300 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300"/>
  </g>

  <!-- subject: heavyweight pullover hoodie, front 3/4 view -->
  <g stroke="#5C2272" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- left sleeve / roomy body / right sleeve as one main fleece mass -->
    <path d="M104 96 L58 128 L48 196 L82 210 L96 132 L96 250 Q150 264 204 250 L204 132 L218 210 L252 196 L242 128 L196 96 Z" fill="url(#hoodBody)"/>
    <!-- ribbed cuffs -->
    <path d="M48 196 L82 210 L86 188 L52 174 Z" fill="url(#hoodPocket)"/>
    <path d="M252 196 L218 210 L214 188 L248 174 Z" fill="url(#hoodPocket)"/>
    <!-- ribbed hem -->
    <path d="M96 250 Q150 264 204 250 L204 268 Q150 282 96 268 Z" fill="url(#hoodPocket)"/>
    <!-- hood collar bunched at the neckline -->
    <path d="M104 96 Q150 70 196 96 Q188 124 150 130 Q112 124 104 96 Z" fill="url(#hoodHood)"/>
    <!-- inner hood opening -->
    <path d="M120 98 Q150 84 180 98 Q172 116 150 120 Q128 116 120 98 Z" fill="url(#hoodPocket)"/>
    <!-- kangaroo pocket -->
    <path d="M114 188 Q150 200 186 188 L182 232 Q150 244 118 232 Z" fill="url(#hoodPocket)"/>
  </g>

  <!-- fine line-accent detail (currentColor) -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- drawstrings -->
    <path d="M138 116 L132 156"/>
    <path d="M162 116 L168 156"/>
    <!-- pocket center seam -->
    <path d="M150 196 L150 238" stroke-opacity="0.7"/>
    <!-- hem + cuff ribbing ticks -->
    <path d="M108 256 V270 M124 259 V273 M150 260 V274 M176 259 V273 M192 256 V270" stroke-opacity="0.5"/>
  </g>
  <!-- drawstring aglets -->
  <circle cx="132" cy="158" r="3.5" fill="#5C2272" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="168" cy="158" r="3.5" fill="#5C2272" stroke="currentColor" stroke-width="1.5"/>

  <!-- chest shield + >_ wordmark emblem -->
  <g>
    <path d="M188 132 L208 138 L208 154 Q208 168 198 174 Q188 168 188 154 Z" fill="url(#hoodHood)" stroke="#5C2272" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M194 146 L199 151 L194 156"/>
      <path d="M201 158 L205 158"/>
    </g>
  </g>

  <!-- white sheen highlight -->
  <path d="M104 96 L96 132 L96 200 L110 196 L116 130 Z" fill="#ffffff" fill-opacity="0.12"/>

  <!-- glow accent dots -->
  <circle cx="150" cy="60" r="3.5" fill="#AD38DB"/>
  <circle cx="232" cy="206" r="3" fill="#C254E8" fill-opacity="0.85"/>
</svg>
