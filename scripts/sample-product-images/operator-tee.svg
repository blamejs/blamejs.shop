<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Post-Quantum Crew Tee" color="#C254E8">
  <defs>
    <radialGradient id="teeGlow" cx="50%" cy="48%" r="56%">
      <stop offset="0%" stop-color="#AD38DB" stop-opacity="0.32"/>
      <stop offset="58%" stop-color="#732A8D" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#AD38DB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teeFabric" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#B845E3"/>
      <stop offset="50%" stop-color="#AD38DB"/>
      <stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
    <linearGradient id="teeSleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E33B0"/>
      <stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
    <radialGradient id="teeEmblem" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
  </defs>

  <!-- soft radial glow -->
  <rect width="300" height="300" fill="url(#teeGlow)"/>

  <!-- faint backdrop grid -->
  <g stroke="currentColor" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 50 H300 M0 100 H300 M0 150 H300 M0 200 H300 M0 250 H300 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300"/>
  </g>

  <!-- hanging crew tee -->
  <g stroke="#5C2272" stroke-width="2.5" stroke-linejoin="round">
    <!-- left sleeve -->
    <path d="M118 78 L78 100 L66 138 L92 150 L104 124 Z" fill="url(#teeSleeve)"/>
    <!-- right sleeve -->
    <path d="M182 78 L222 100 L234 138 L208 150 L196 124 Z" fill="url(#teeSleeve)"/>
    <!-- body -->
    <path d="M118 78 C130 92 170 92 182 78 L196 124 L196 232 C196 238 192 242 186 242 L114 242 C108 242 104 238 104 232 L104 124 Z" fill="url(#teeFabric)"/>
  </g>

  <!-- fabric sheen highlight -->
  <path d="M122 130 C124 118 124 106 121 96 L132 100 C133 112 132 128 130 144 Z" fill="#ffffff" fill-opacity="0.10"/>

  <!-- collar ribbing (fine detail) -->
  <path d="M122 79 C133 92 167 92 178 79" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M126 84 C135 94 165 94 174 84" fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round"/>

  <!-- chest emblem: shield + terminal mark -->
  <g transform="translate(150 158)">
    <circle r="26" fill="url(#teeEmblem)" stroke="#08080a" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M0 -16 L13 -11 L13 1 C13 10 7 15 0 18 C-7 15 -13 10 -13 1 L-13 -11 Z" fill="none" stroke="#C254E8" stroke-width="2.4" stroke-linejoin="round"/>
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 -4 L-1 0 L-6 4"/>
      <path d="M2 5 H8"/>
    </g>
  </g>

  <!-- hem stitch accent -->
  <path d="M120 230 H180" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.5" stroke-dasharray="3 4"/>

  <!-- glow accent dots -->
  <circle cx="234" cy="90" r="4" fill="#AD38DB"/>
  <circle cx="68" cy="206" r="3" fill="#C254E8" fill-opacity="0.85"/>
</svg>
