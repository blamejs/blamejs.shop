<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Self-Hosted Plan" color="#C254E8">
  <defs>
    <radialGradient id="shGlow" cx="50%" cy="52%" r="56%">
      <stop offset="0%" stop-color="#AD38DB" stop-opacity="0.34"/>
      <stop offset="58%" stop-color="#732A8D" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#AD38DB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shTower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E33B0"/><stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
    <linearGradient id="shTowerSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E2887"/><stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
    <linearGradient id="shShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C254E8"/><stop offset="48%" stop-color="#AD38DB"/><stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
    <linearGradient id="shPager" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AD38DB"/><stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#shGlow)"/>
  <g stroke="currentColor" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 50 H300 M0 100 H300 M0 150 H300 M0 200 H300 M0 250 H300 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300"/>
  </g>
  <!-- slim server tower: front + side faces -->
  <g stroke="#5C2272" stroke-width="2.5" stroke-linejoin="round">
    <!-- right side face -->
    <path d="M150 56 L176 66 L176 244 L150 252 Z" fill="url(#shTowerSide)"/>
    <!-- front face -->
    <path d="M70 52 L150 56 L150 252 L70 256 Z" fill="url(#shTower)"/>
    <!-- top face -->
    <path d="M70 52 L96 42 L176 46 L150 56 Z" fill="#3d1a4d" fill-opacity="0.6"/>
  </g>
  <!-- vent slits along the top of the front face -->
  <g stroke="currentColor" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M80 72 H140 M80 80 H140 M80 88 H140 M80 96 H140"/>
  </g>
  <!-- status LED row -->
  <g>
    <circle cx="84" cy="116" r="3.5" fill="#C254E8"/>
    <circle cx="98" cy="116" r="3.5" fill="#AD38DB"/>
    <circle cx="112" cy="116" r="3.5" fill="#8E33B0"/>
    <circle cx="126" cy="116" r="3.5" fill="#6E2887"/>
  </g>
  <!-- shield emblem on the front -->
  <g stroke="#5C2272" stroke-width="2.5" stroke-linejoin="round">
    <path d="M110 142 L142 150 L142 188 Q142 212 110 226 Q78 208 78 184 L78 150 Z" fill="url(#shShield)"/>
    <path d="M94 182 L106 196 L128 164" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- lower vent slits -->
  <g stroke="currentColor" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <path d="M80 240 H140 M80 232 H120"/>
  </g>
  <!-- pager / alert glyph beside the tower -->
  <g stroke="#5C2272" stroke-width="2.5" stroke-linejoin="round">
    <rect x="196" y="168" width="56" height="74" rx="9" fill="url(#shPager)"/>
    <rect x="206" y="180" width="36" height="22" rx="4" fill="#3d1a4d" fill-opacity="0.7" stroke="#5C2272" stroke-width="1.6"/>
  </g>
  <!-- pager screen alert text lines -->
  <g stroke="currentColor" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round">
    <path d="M211 188 H237 M211 195 H229"/>
  </g>
  <!-- pager buttons -->
  <g>
    <circle cx="213" cy="218" r="4.5" fill="#C254E8"/>
    <circle cx="232" cy="218" r="4.5" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M205 232 H243" stroke="currentColor" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- alert signal arcs radiating from the pager -->
  <g fill="none" stroke="#AD38DB" stroke-width="2.4" stroke-linecap="round">
    <path d="M252 150 Q264 158 264 172" stroke-opacity="0.75"/>
    <path d="M258 140 Q278 152 278 174" stroke-opacity="0.45"/>
  </g>
  <!-- white sheen down the front face -->
  <path d="M70 52 L92 53 L84 256 L70 256 Z" fill="#ffffff" fill-opacity="0.12"/>
  <!-- glow accent dots -->
  <circle cx="150" cy="62" r="3.5" fill="#AD38DB"/>
  <circle cx="216" cy="232" r="3" fill="#C254E8" fill-opacity="0.85"/>
</svg>
