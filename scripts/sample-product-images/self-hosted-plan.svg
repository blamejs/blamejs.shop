<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Self-Hosted Plan — annual support license for self-hosted blamejs deployments">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0f5c"/>
      <stop offset="100%" stop-color="#0a1f44"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2c8a3f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2c8a3f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- 3-unit server rack silhouette -->
  <g transform="translate(400,470)">
    <!-- rack frame -->
    <rect x="-220" y="-180" width="440" height="360" rx="14" fill="url(#server)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <!-- U1 -->
    <g transform="translate(0,-110)">
      <rect x="-200" y="-40" width="400" height="80" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <circle cx="-170" cy="0" r="9" fill="url(#led)"/>
      <circle cx="-170" cy="0" r="5" fill="#2c8a3f"/>
      <rect x="-140" y="-16" width="120" height="32" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="-16" width="80" height="32" rx="3" fill="rgba(255,255,255,0.08)"/>
      <text x="160" y="6" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="14" font-weight="700" fill="rgba(255,255,255,0.55)" text-anchor="end">node-01</text>
    </g>
    <!-- U2 (accent) -->
    <g transform="translate(0,0)">
      <rect x="-200" y="-40" width="400" height="80" rx="6" fill="#fa4f09" opacity="0.92" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <circle cx="-170" cy="0" r="9" fill="rgba(255,255,255,0.9)"/>
      <text x="0" y="8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="0.18em" fill="#ffffff" text-anchor="middle">SELF-HOSTED</text>
    </g>
    <!-- U3 -->
    <g transform="translate(0,110)">
      <rect x="-200" y="-40" width="400" height="80" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <circle cx="-170" cy="0" r="9" fill="url(#led)"/>
      <circle cx="-170" cy="0" r="5" fill="#2c8a3f"/>
      <rect x="-140" y="-16" width="120" height="32" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="0" y="-16" width="80" height="32" rx="3" fill="rgba(255,255,255,0.08)"/>
      <text x="160" y="6" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="14" font-weight="700" fill="rgba(255,255,255,0.55)" text-anchor="end">node-03</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#b67aff">CATALOG · DIGITAL</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Self-Hosted Plan</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.7)">Annual support license · your servers, your keys</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.45)">SHP-SUP-1Y</text>
  </g>
</svg>
