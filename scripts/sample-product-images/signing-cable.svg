<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Signing cable" color="#C254E8">
  <defs>
    <radialGradient id="cabGlow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#AD38DB" stop-opacity="0.34"/>
      <stop offset="58%" stop-color="#732A8D" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#AD38DB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabCord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C254E8"/>
      <stop offset="50%" stop-color="#AD38DB"/>
      <stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
    <linearGradient id="cabPlug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C254E8"/>
      <stop offset="48%" stop-color="#AD38DB"/>
      <stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
    <linearGradient id="cabPod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E33B0"/>
      <stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#cabGlow)"/>
  <g stroke="currentColor" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 50 H300 M0 100 H300 M0 150 H300 M0 200 H300 M0 250 H300 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300"/>
  </g>
  <!-- the cable cord: an S-curve sweeping from lower-left plug to upper-right plug -->
  <path d="M58 232 C 92 196, 96 150, 132 138 C 174 124, 192 96, 240 70"
        fill="none" stroke="#5C2272" stroke-width="13" stroke-linecap="round"/>
  <path d="M58 232 C 92 196, 96 150, 132 138 C 174 124, 192 96, 240 70"
        fill="none" stroke="url(#cabCord)" stroke-width="8" stroke-linecap="round"/>
  <path d="M58 232 C 92 196, 96 150, 132 138 C 174 124, 192 96, 240 70"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2.4" stroke-linecap="round"/>
  <!-- lower-left USB-C connector -->
  <g>
    <rect x="36" y="226" width="34" height="20" rx="9" transform="rotate(-44 53 236)" fill="#5C2272"/>
    <rect x="40" y="229" width="26" height="14" rx="7" transform="rotate(-44 53 236)" fill="url(#cabPlug)"/>
    <rect x="44" y="234" width="17" height="4" rx="2" transform="rotate(-44 52.5 236)" fill="currentColor" fill-opacity="0.6"/>
  </g>
  <rect x="62" y="218" width="14" height="13" rx="3" transform="rotate(-44 69 224.5)" fill="#6E2887"/>
  <!-- upper-right USB-C connector -->
  <g>
    <rect x="230" y="60" width="34" height="20" rx="9" transform="rotate(-44 247 70)" fill="#5C2272"/>
    <rect x="234" y="63" width="26" height="14" rx="7" transform="rotate(-44 247 70)" fill="url(#cabPlug)"/>
    <rect x="238" y="68" width="17" height="4" rx="2" transform="rotate(-44 246.5 70)" fill="currentColor" fill-opacity="0.6"/>
  </g>
  <rect x="224" y="78" width="14" height="13" rx="3" transform="rotate(-44 231 84.5)" fill="#6E2887"/>
  <!-- in-line signing-chip pod mid-cable -->
  <g transform="rotate(-30 150 150)">
    <rect x="116" y="128" width="68" height="44" rx="14" fill="#5C2272"/>
    <rect x="120" y="132" width="60" height="36" rx="11" fill="url(#cabPod)"/>
    <rect x="120" y="132" width="60" height="15" rx="11" fill="#ffffff" fill-opacity="0.12"/>
    <!-- shield with checkmark -->
    <path d="M150 138 L165 143 V153 C165 162 158 167 150 170 C142 167 135 162 135 153 V143 Z"
          fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M143.5 153.5 L148.5 158.5 L157 148"
          fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- glow accent dots -->
  <circle cx="150" cy="62" r="3.5" fill="#AD38DB"/>
  <circle cx="216" cy="232" r="3" fill="#C254E8" fill-opacity="0.85"/>
</svg>
