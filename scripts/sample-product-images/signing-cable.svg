<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Signing Cable — USB-C cable with in-line PQC signing chip">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f44"/>
      <stop offset="100%" stop-color="#0d2f5e"/>
    </linearGradient>
    <linearGradient id="connector" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fa4f09"/>
      <stop offset="100%" stop-color="#c93b00"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Cable curving across, chip mid-line -->
  <g transform="translate(400,460)">
    <!-- cable -->
    <path d="M-280 -40 Q -180 -120 -60 -40 Q 60 40 180 -40 Q 260 -90 280 -40"
          fill="none" stroke="#1a1a1a" stroke-width="22" stroke-linecap="round"/>
    <path d="M-280 -40 Q -180 -120 -60 -40 Q 60 40 180 -40 Q 260 -90 280 -40"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="22" stroke-linecap="round" stroke-dasharray="2 16"/>

    <!-- USB-C connector left -->
    <g transform="translate(-300,-40) rotate(-20)">
      <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#connector)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <rect x="-16" y="-10" width="32" height="20" rx="10" fill="#444"/>
    </g>
    <!-- USB-C connector right -->
    <g transform="translate(300,-40) rotate(20)">
      <rect x="-30" y="-22" width="60" height="44" rx="8" fill="url(#connector)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <rect x="-16" y="-10" width="32" height="20" rx="10" fill="#444"/>
    </g>
    <!-- in-line PQC chip -->
    <g transform="translate(-60,-40)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#chip)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <text x="0" y="7" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="18" font-weight="800" letter-spacing="0.16em" fill="#ffffff" text-anchor="middle">PQC</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#7fb1ff">CATALOG · HARDWARE</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Signing Cable</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.65)">USB-C · in-line ML-DSA-65 signing chip</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.45)">SGN-CBL-1M</text>
  </g>
</svg>
