<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Sticker Pack — six vinyl decals with framework marks">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Six scattered vinyl stickers -->
  <g transform="translate(400,470)">
    <!-- Sticker 1 — orange shield -->
    <g transform="translate(-180,-110) rotate(-14)">
      <rect x="-70" y="-70" width="140" height="140" rx="20" fill="#fa4f09" stroke="#ffffff" stroke-width="6"/>
      <path d="M-44 -20 L-22 -36 L-8 -30 L0 -34 L8 -30 L22 -36 L44 -20 L34 14 L24 10 L24 40 L-24 40 L-24 10 L-34 14 Z" fill="#ffffff"/>
    </g>
    <!-- Sticker 2 — purple PQC circle -->
    <g transform="translate(20,-130) rotate(8)">
      <circle cx="0" cy="0" r="78" fill="#6a1bff" stroke="#ffffff" stroke-width="6"/>
      <text x="0" y="10" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="0.1em" fill="#ffffff" text-anchor="middle">PQC</text>
    </g>
    <!-- Sticker 3 — green checkmark badge -->
    <g transform="translate(190,-90) rotate(-6)">
      <path d="M0 -78 L20 -64 L42 -68 L52 -48 L72 -38 L66 -16 L78 4 L62 22 L58 44 L36 46 L20 60 L0 50 L-20 60 L-36 46 L-58 44 L-62 22 L-78 4 L-66 -16 L-72 -38 L-52 -48 L-42 -68 L-20 -64 Z"
            fill="#2c8a3f" stroke="#ffffff" stroke-width="6"/>
      <path d="M-26 4 L-8 22 L28 -18" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Sticker 4 — navy SBOM tag -->
    <g transform="translate(-200,80) rotate(10)">
      <rect x="-80" y="-44" width="160" height="88" rx="14" fill="#0a1f44" stroke="#ffffff" stroke-width="6"/>
      <text x="0" y="10" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="26" font-weight="800" letter-spacing="0.16em" fill="#ffffff" text-anchor="middle">SBOM</text>
    </g>
    <!-- Sticker 5 — white wordmark -->
    <g transform="translate(40,130) rotate(-4)">
      <rect x="-110" y="-40" width="220" height="80" rx="14" fill="#ffffff" stroke="#191919" stroke-width="4"/>
      <text x="0" y="10" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="0.08em" fill="#191919" text-anchor="middle">blamejs.shop</text>
    </g>
    <!-- Sticker 6 — deep-orange angle bracket -->
    <g transform="translate(220,100) rotate(12)">
      <rect x="-60" y="-60" width="120" height="120" rx="18" fill="#c93b00" stroke="#ffffff" stroke-width="6"/>
      <text x="0" y="20" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="58" font-weight="800" fill="#ffffff" text-anchor="middle">{ }</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#fa4f09">CATALOG · APPAREL</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Sticker Pack</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.65)">Six vinyl decals · weather-rated · die-cut</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.45)">STK-PCK-6</text>
  </g>
</svg>
