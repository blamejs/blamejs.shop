<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Sticker Pack" color="#C254E8">
  <defs>
    <radialGradient id="spkGlow" cx="50%" cy="52%" r="56%">
      <stop offset="0%" stop-color="#AD38DB" stop-opacity="0.34"/>
      <stop offset="58%" stop-color="#732A8D" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#AD38DB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spkShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C254E8"/><stop offset="48%" stop-color="#AD38DB"/><stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
    <linearGradient id="spkPqc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AD38DB"/><stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
    <linearGradient id="spkSbom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E33B0"/><stop offset="100%" stop-color="#5C2272"/>
    </linearGradient>
    <linearGradient id="spkBrace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C254E8"/><stop offset="100%" stop-color="#732A8D"/>
    </linearGradient>
    <linearGradient id="spkCheck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AD38DB"/><stop offset="55%" stop-color="#8E33B0"/><stop offset="100%" stop-color="#6E2887"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#spkGlow)"/>
  <g stroke="currentColor" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 50 H300 M0 100 H300 M0 150 H300 M0 200 H300 M0 250 H300 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300"/>
  </g>
  <!-- SBOM tag sticker, back-left -->
  <g transform="rotate(-14 92 196)">
    <rect x="50" y="174" width="84" height="44" rx="11" fill="url(#spkSbom)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <rect x="50" y="174" width="84" height="44" rx="11" fill="none" stroke="#5C2272" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="64" cy="196" r="4" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="98" y="202" font-family="monospace" font-size="17" font-weight="700" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" stroke="none">SBOM</text>
  </g>
  <!-- brace-pair mark sticker, back-right -->
  <g transform="rotate(13 210 188)">
    <rect x="174" y="162" width="72" height="52" rx="14" fill="url(#spkBrace)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <rect x="174" y="162" width="72" height="52" rx="14" fill="none" stroke="#5C2272" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="210" y="196" font-family="monospace" font-size="22" font-weight="700" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" stroke="none">&gt;_</text>
  </g>
  <!-- checkmark round sticker, right -->
  <g transform="rotate(8 214 116)">
    <circle cx="214" cy="116" r="29" fill="url(#spkCheck)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="214" cy="116" r="29" fill="none" stroke="#5C2272" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M201 116 l9 9 l16 -19" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- PQC badge sticker, lower-center -->
  <g transform="rotate(-6 150 214)">
    <circle cx="150" cy="214" r="30" fill="url(#spkPqc)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="150" cy="214" r="30" fill="none" stroke="#5C2272" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="150" cy="214" r="22" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="150" y="220" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff" fill-opacity="0.92" text-anchor="middle" stroke="none">PQC</text>
  </g>
  <!-- shield sticker, top-center front -->
  <g transform="rotate(4 144 116)">
    <path d="M144 78 l34 13 v28 c0 26 -18 41 -34 49 c-16 -8 -34 -23 -34 -49 v-28 z" fill="url(#spkShield)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M144 78 l34 13 v28 c0 26 -18 41 -34 49 c-16 -8 -34 -23 -34 -49 v-28 z" fill="none" stroke="#5C2272" stroke-width="1.6" stroke-dasharray="5 3" stroke-linejoin="round"/>
    <path d="M131 122 l9 9 l18 -22" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 96 q26 -10 52 0" fill="#ffffff" fill-opacity="0.12" stroke="none"/>
  </g>
  <!-- glow accent dots -->
  <circle cx="150" cy="62" r="3.5" fill="#AD38DB"/>
  <circle cx="216" cy="232" r="3" fill="#C254E8" fill-opacity="0.85"/>
</svg>
