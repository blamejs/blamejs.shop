<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Operator Mug — branded ceramic mug with shield wordmark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c93b00"/>
      <stop offset="100%" stop-color="#fa4f09"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f1e8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcd6c0"/>
    </linearGradient>
    <radialGradient id="coffee" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3a1d05"/>
      <stop offset="100%" stop-color="#1a0d02"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Mug silhouette -->
  <g transform="translate(400,470)">
    <!-- handle -->
    <path d="M150 -90 C 250 -90 250 90 150 90"
          fill="none" stroke="url(#mug)" stroke-width="28" stroke-linecap="round"/>
    <path d="M150 -90 C 250 -90 250 90 150 90"
          fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="28" stroke-linecap="round" opacity="0.3"/>
    <!-- body -->
    <rect x="-180" y="-140" width="340" height="280" rx="22" fill="url(#mug)" stroke="rgba(0,0,0,0.18)" stroke-width="2"/>
    <!-- coffee surface (top ellipse) -->
    <ellipse cx="-10" cy="-138" rx="170" ry="22" fill="url(#coffee)" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
    <!-- inner rim shadow -->
    <ellipse cx="-10" cy="-138" rx="158" ry="14" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1.5"/>

    <!-- printed shield wordmark on mug -->
    <g transform="translate(-10,15)">
      <path d="M-70 -50 L-40 -75 L-15 -65 L0 -70 L15 -65 L40 -75 L70 -50 L55 -10 L40 -15 L40 50 L-40 50 L-40 -15 L-55 -10 Z"
            fill="#fa4f09"/>
      <text x="0" y="85" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="0.18em" fill="#191919" text-anchor="middle">OPERATOR</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff">
    <text x="60" y="92" font-size="22" font-weight="700" letter-spacing="0.24em" fill="#ffffff">CATALOG · APPAREL</text>
    <text x="60" y="148" font-size="64" font-weight="800" letter-spacing="-0.02em">Operator Mug</text>
    <text x="60" y="194" font-size="22" font-weight="500" fill="rgba(255,255,255,0.78)">11oz ceramic · dishwasher safe · shield mark</text>
    <text x="60" y="752" font-size="18" font-weight="600" letter-spacing="0.16em" fill="rgba(255,255,255,0.55)">OPR-MUG-11</text>
  </g>
</svg>
