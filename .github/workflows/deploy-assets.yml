# Deploy to Cloudflare — the Worker + container, and the R2 theme assets.
#
# Cloudflare's git-integration "Workers Builds" auto-deploy is disabled, so
# this workflow owns the whole deploy. On every push to main (and on manual
# dispatch):
#   - `deploy` runs `wrangler deploy`: bundles the Worker, builds the
#     container image from the Dockerfile (running the in-image smoke
#     gate), pushes it to the Cloudflare registry, and rolls the deploy.
#   - `assets` syncs the theme stylesheets / fonts / island scripts to the
#     R2 bucket the Worker serves /assets/* from. `wrangler deploy` never
#     touches R2, so without this a stylesheet/font change would ship a
#     Worker pointing at stale objects.
#
# Auth: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (the `npm-publish`
# environment). The token needs Workers Scripts:Edit + Cloudflare
# Containers + Workers R2 Storage:Edit; an R2-only token can't deploy the
# Worker/container.
#
# Actions are pinned to a 40-char commit SHA; the trailing comment names
# the tag it resolves to (mutable tag, immutable SHA).

name: Deploy (worker + container + assets)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

# Never roll two deploys at once; let an in-flight deploy finish rather
# than cancel it (a cancelled container roll can leave a mixed image set).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy (worker + container)
    # Sync the R2 assets FIRST, then deploy the worker/container that
    # references them by Subresource Integrity hash — a freshly-deployed
    # worker must never point at assets not yet in R2, or its pages fail
    # the integrity check. (The bytes rarely change between releases, so
    # this only matters on an asset change; content-addressed/fingerprinted
    # asset names would make it fully race-free — a future refinement.)
    needs: assets
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with: { node-version: '24.14.1' }
      - name: Install wrangler
        run: npm ci
      - name: Deploy worker + container
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — cannot deploy. Set both environment secrets."
            exit 1
          fi
          node node_modules/wrangler/bin/wrangler.js deploy

  assets:
    name: Sync theme assets to R2
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with: { node-version: '24.14.1' }
      - name: Install wrangler
        run: npm ci
      - name: Sync assets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping R2 asset sync."
            exit 0
          fi
          node scripts/sync-r2-assets.js
