# Deploy theme assets to R2.
#
# Cloudflare Workers Builds redeploys the Worker + container on a push to
# main, but `wrangler deploy` never populates the R2 bucket the Worker
# serves `/assets/*` from — so a stylesheet / font / island-script change
# would otherwise ship a Worker that points at stale R2 objects (the live
# HTML rendering against an old asset). This syncs the theme assets to R2
# whenever they change, so the assets land alongside the Worker that
# references them.
#
# Auth: set CLOUDFLARE_API_TOKEN (R2 edit scope) + CLOUDFLARE_ACCOUNT_ID
# as repository secrets. Without them the job skips with a warning rather
# than failing — the Worker/container deploy is unaffected.
#
# Actions are pinned to a 40-char commit SHA; the trailing comment names
# the tag it resolves to (mutable tag, immutable SHA).

name: Deploy assets (R2)

on:
  push:
    branches: ["main"]
    paths: ["themes/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-assets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync theme assets to R2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.0.0
        with: { node-version: '24.14.1' }
      - name: Install wrangler
        run: npm ci
      - name: Sync assets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping R2 asset sync. The Worker/container deploy is unaffected; set both repository secrets to enable automatic asset sync."
            exit 0
          fi
          node scripts/sync-r2-assets.js
