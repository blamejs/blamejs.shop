# Deploy the Worker + container to Cloudflare.
#
# Cloudflare's own "Workers Builds" git-integration deploy is disabled, so
# this workflow owns the deploy: on every push to main (and on manual
# dispatch) it runs `wrangler deploy`, which bundles the Worker, builds the
# container image from the Dockerfile (running the in-image smoke gate),
# pushes it to the Cloudflare registry, and rolls the deployment. The
# companion deploy-assets workflow syncs the R2 theme assets in parallel.
#
# Auth: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (the `npm-publish`
# environment). The token needs Workers Scripts:Edit + Cloudflare
# Containers + Workers R2 Storage:Edit on this account; an R2-only token is
# not sufficient for the container/worker deploy.
#
# Actions are pinned to a 40-char commit SHA; the trailing comment names
# the tag it resolves to.

name: Deploy (worker + container)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

# Never roll two deploys at once; let an in-flight deploy finish rather
# than cancel it half-way (a cancelled container roll can leave the
# service on a mixed image set).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.0.0
        with: { node-version: '24.14.1' }
      - name: Install wrangler
        run: npm ci
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — cannot deploy. Set both repository/environment secrets."
            exit 1
          fi
          node node_modules/wrangler/bin/wrangler.js deploy
