name: CodeQL SAST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly re-scan — catches any new CodeQL rule that lands
    # between releases against the current main without waiting for
    # the next push to trigger an analysis.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analysis (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: github/codeql-action/init@87557b9c84dde89fdd9b10e88954ac2f4248e463  # v4.36.1
        with:
          languages: javascript-typescript
          # The vendored blamejs tree comes from upstream; scan only
          # our own surface so we get signal on integration code, not
          # on the framework we vendor. `paths-ignore` is a config
          # property — it is silently ignored if passed as a bare
          # action input, so it must nest under `config:`.
          config: |
            paths-ignore:
              - lib/vendor/**
      - uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463  # v4.36.1
        with:
          category: "/language:javascript-typescript"
