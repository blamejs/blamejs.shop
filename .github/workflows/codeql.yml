name: CodeQL SAST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly re-scan — catches any new CodeQL rule that lands
    # between releases against the current main without waiting for
    # the next push to trigger an analysis.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analysis (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          languages: javascript-typescript
          # The vendored blamejs tree comes from upstream; scan only
          # our own surface so we get signal on integration code, not
          # on the framework we vendor. The test suite is not part of
          # any shipped artifact — the npm `files` allowlist omits it
          # and the container runtime stage never COPYs it — so its
          # fixtures are not an attack surface; exclude it too.
          # `paths-ignore` is a config property — it is silently
          # ignored if passed as a bare action input, so it must nest
          # under `config:`.
          config: |
            paths-ignore:
              - lib/vendor/**
              - test/**
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          category: "/language:javascript-typescript"
