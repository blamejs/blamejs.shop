name: Upstream currency

# Runs scripts/check-currency.js once a day against main. When the vendored
# blamejs or a pinned action is behind its latest release, the job opens an
# issue (or updates the open one) listing each stale entry and the line to
# paste. When everything is current again, it closes that issue. The job does
# not vendor or change anything; run `bash scripts/vendor-update.sh blamejs
# <tag>` or update the pin by hand.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-currency
  cancel-in-progress: false

jobs:
  check:
    name: Vendored blamejs + action pins vs latest releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: '24.22.1' }
      - name: Check, then open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Upstream releases available: vendored blamejs or pinned actions"
        run: |
          rc=0
          node scripts/check-currency.js > currency.log 2>&1 || rc=$?
          cat currency.log

          open_issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"

          if [ "$rc" -eq 0 ]; then
            if grep -q 'UNVERIFIED' currency.log; then
              echo "::warning::Some upstream releases could not be checked; the tracking issue is left as it is."
              exit 0
            fi
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --comment "Every pinned action and vendored package is at its latest release."
            fi
            exit 0
          fi

          if ! grep -q '^STALE ' currency.log; then
            echo "::error::check-currency.js exited $rc without reporting a stale entry"
            exit "$rc"
          fi

          {
            echo "scripts/check-currency.js reports entries behind their latest upstream release."
            echo
            echo "To refresh blamejs: \`bash scripts/vendor-update.sh blamejs <tag>\`, then review the upstream CHANGELOG entries against the shop's call sites."
            echo "To update an action pin: paste the line shown for it into every file listed."
            echo
            echo '```'
            grep -E '^(STALE |  )' currency.log
            echo '```'
          } > issue-body.md

          if [ -n "$open_issue" ]; then
            gh issue edit "$open_issue" --body-file issue-body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
          fi
