# CI — gates that every push/PR runs against the in-flight branch.
#
# The discipline mirrors the upstream blamejs workflow: every action
# is pinned to a 40-char commit SHA, the trailing comment names the
# tag the SHA resolves to. Tag-pinning is mutable; SHA-pinning is
# not. New action versions need both an SHA bump AND a comment
# update; the audit trail stays in `git log`.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint (lib + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with: { node-version: '24.16.0' }
      - run: npx eslint@latest --max-warnings 0 .

  shellcheck:
    name: ShellCheck (shell scripts)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # v2.0.0

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with: { fetch-depth: 0 }
      # Run gitleaks via its published container rather than the
      # marketplace action — the repo's Actions allowlist permits only
      # the vetted set, and a disallowed `uses:` fails the whole
      # workflow at startup. Mirrors the operator-local scan in the
      # release runbook + the docker pattern the actionlint job uses.
      - name: Scan git history for secrets
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest git --config=.gitleaks.toml --redact --exit-code=1

  actionlint:
    name: Actionlint (workflow files)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  vendor-drift:
    name: Vendor drift (blamejs vs latest tag)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/vendor-update.sh --check

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with: { node-version: '24.16.0' }
      - name: Verify the committed vendored blamejs is present
        # Smoke runs against the COMMITTED lib/vendor/ tree — the exact
        # tree the Dockerfile copies into the deployed container — so the
        # gate tests what we ship. Re-fetching `latest` here drifted the
        # gate ahead of the deployed version and red-lit CI on an upstream
        # release we hadn't adopted. The `vendor-drift` job keeps the
        # committed-vs-latest signal as a non-blocking warning.
        run: test -f lib/vendor/blamejs/lib/app.js || { echo "::error::lib/vendor/blamejs missing from checkout — the vendored tree must be committed"; exit 1; }
        shell: bash
      - name: Run smoke
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node test/smoke.js

  inimage-smoke:
    # Replicates the container build's in-image smoke: the Dockerfile copies
    # the build context (minus everything .dockerignore strips — worker/,
    # .github/, the Dockerfile, wrangler.toml) and runs `node test/smoke.js`.
    # A smoke gate that reads or imports any stripped path without tolerating
    # its absence crashes there and fails the Workers Build AFTER merge — which
    # bricks the deploy (the container never rolls). The full-tree smoke above
    # can't catch it because those paths are present. Removing the same set
    # here surfaces that class at pull-request time instead. The CI checkout is
    # ephemeral, so removing them is safe.
    name: In-image smoke (worker-excluded)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with: { node-version: '24.16.0' }
      - name: Verify the committed vendored blamejs is present
        run: test -f lib/vendor/blamejs/lib/app.js || { echo "::error::lib/vendor/blamejs missing from checkout"; exit 1; }
        shell: bash
      - name: Run smoke with the container build context (mirrors .dockerignore)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          # Strip the same paths .dockerignore removes before the in-image
          # `node test/smoke.js`, so a gate that reads any of them must
          # tolerate their absence here or it would brick the Workers Build.
          rm -rf worker .github Dockerfile wrangler.toml
          node test/smoke.js

  e2e-checkout:
    # End-to-end checkout through the LIVE security stack. test/e2e/serve.js
    # boots the full production middleware composition (bot-guard, global
    # rate-limit, fetch-metadata, scoped double-submit CSRF, sealed cookies —
    # nothing disabled) on a node:sqlite backend; the driver HTTP-drives
    # add-to-cart → checkout and asserts the CSRF token round-trips (a
    # mismatched-token POST is rejected 403, a tokened POST is accepted) and an
    # order transitions pending → paid. HTTP-level only — no Playwright. The
    # layer-2 integration tests disable the security stack; this is the only
    # gate that exercises a checkout WITH it on.
    name: E2E checkout (live security stack)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with: { node-version: '24.16.0' }
      - name: Verify the committed vendored blamejs is present
        run: test -f lib/vendor/blamejs/lib/app.js || { echo "::error::lib/vendor/blamejs missing from checkout"; exit 1; }
        shell: bash
      - name: Drive a checkout through the live stack
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node test/e2e/drive-checkout.js

  e2e-account-subscriptions:
    # End-to-end AUTHED subscription plan-change through the LIVE security
    # stack, in a REAL browser. test/e2e/serve-account.js boots the full
    # production middleware composition (bot-guard, global rate-limit,
    # fetch-metadata, scoped double-submit CSRF, sealed cookies — nothing
    # disabled) AND serves the real theme assets so the islands load with
    # their real bytes + SRI; it prints the sealed shop_auth cookie the
    # framework itself mints. The driver injects that cookie into a Playwright
    # browser context (the storefront's auth is passwordless, so a browser
    # can't reach an authed page unaided) and drives /account/subscriptions →
    # the change page → submitting an immediate plan change, asserting the
    # plan flips to premium and that NO console error (CSP / Trusted-Types /
    # broken island / failed fetch) fires on the authed pages. Playwright is a
    # dev/test-only tool, installed on demand here — never an npm runtime dep.
    name: E2E account subscriptions (authed, real browser)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with: { node-version: '24.16.0' }
      - name: Verify the committed vendored blamejs is present
        run: test -f lib/vendor/blamejs/lib/app.js || { echo "::error::lib/vendor/blamejs missing from checkout"; exit 1; }
        shell: bash
      - name: Install Playwright + Chromium (test-only, not a runtime dep)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Drive the authed subscription plan-change in a real browser
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node test/e2e/drive-account-subscriptions.js
