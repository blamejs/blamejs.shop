# CI — gates that every push/PR runs against the in-flight branch.
#
# The discipline mirrors the upstream blamejs workflow: every action
# is pinned to a 40-char commit SHA, the trailing comment names the
# tag the SHA resolves to. Tag-pinning is mutable; SHA-pinning is
# not. New action versions need both an SHA bump AND a comment
# update; the audit trail stays in `git log`.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint (lib + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.0.0
        with: { node-version: '24.14.1' }
      - run: npx eslint@latest --max-warnings 0 .

  shellcheck:
    name: ShellCheck (shell scripts)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # v2.0.0

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: Actionlint (workflow files)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  vendor-drift:
    name: Vendor drift (blamejs vs latest tag)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
      - run: bash scripts/vendor-update.sh --check

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.0.0
        with: { node-version: '24.14.1' }
      - name: Vendor blamejs (latest tag)
        # Smoke can't run without a vendored copy; fetch it fresh on
        # every CI run so we exercise against the latest blamejs
        # release rather than a stale shrink-wrap.
        run: bash scripts/vendor-update.sh blamejs latest
        shell: bash
      - name: Run smoke
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node test/smoke.js
